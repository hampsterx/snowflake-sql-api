[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "snowflake-sql-api"
dynamic = ["version"]
description = "Lightweight, pure-Python client for Snowflake's SQL API v2"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "hampsterx" }]
keywords = ["snowflake", "sql", "rest", "api", "httpx", "serverless", "lambda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "PyJWT>=2.4",
    "cryptography>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage[toml]>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "ruff>=0.4",
    # Held to 26.5.x so CI formats with the same black the pre-commit hook
    # pins (rev 26.5.1 in .pre-commit-config.yaml). Move the two together by
    # hand; Dependabot ignores black (.github/dependabot.yml).
    "black>=26.5,<26.6",
    "mypy>=1.8",
    "build>=1.0",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/hampsterx/snowflake-sql-api"
Repository = "https://github.com/hampsterx/snowflake-sql-api"
Issues = "https://github.com/hampsterx/snowflake-sql-api/issues"

[project.scripts]
snowflake-sql-api = "snowflake_sql_api.cli:main"

# Auto-registers the snowflake_sql_api.testing pytest fixtures (fake_snowflake,
# snowflake_client, async_snowflake_client) for any project with the package
# installed. The fixtures are no-ops if pytest is absent.
[project.entry-points.pytest11]
snowflake_sql_api = "snowflake_sql_api.testing"

# Version is derived from the git tag (hatch-vcs); never hand-edit it. The build
# writes the resolved version into snowflake_sql_api/_version.py (gitignored).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "snowflake_sql_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["snowflake_sql_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/snowflake_sql_api",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
# E501 (line length) is owned by black. `UP` (pyupgrade) is not enabled yet: the
# code predates the 3.11 floor and still spells `Optional`/`List`, so turning it
# on is a ~250-site annotation rewrite of its own.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 88
# Pin to the floor's grammar: a single floor target keeps black's AST safety
# check parseable by the interpreter running CI.
target-version = ["py311"]

[tool.mypy]
# The runtime floor; the pytest matrix (3.11-3.15) imports every module under
# each supported interpreter.
python_version = "3.11"
files = ["snowflake_sql_api"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "regression: regression test for a specific fixed bug",
    "smoke: live test against a real Snowflake account (opt-in, dev-only)",
]

[tool.coverage.run]
source = ["snowflake_sql_api"]
branch = true

[tool.coverage.report]
show_missing = true
# Enforced locally too, not just in CI: `coverage report` exits non-zero below
# this. (Run coverage via `coverage run -m pytest`, not `pytest --cov`; see AGENTS.md.)
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
